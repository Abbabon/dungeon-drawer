<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#efe6d4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />

    <!-- Stamp the theme before the first paint. React mounts too late:
         a flash of the daylight palette is exactly what night mode is for.
         An explicit choice is remembered in dd_theme; no cookie follows the OS. -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)dd_theme=(light|dark)/);
          var dark = m ? m[1] === 'dark'
            : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* cookies blocked — the stylesheet still has a sane default */
        }
      })();
    </script>

    <!-- Title, description, Open Graph and Twitter tags are generated per
         locale by the localePages() plugin in vite.config.ts. English lands
         here in dist/index.html; the other languages get dist/<lang>/index.html. -->
    <!--locale-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
